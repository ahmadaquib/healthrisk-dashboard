[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for disease risk prediction"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
